<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>email Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hdr">
    <div class="addr-block">
      <div class="label">Current address</div>
      <div id="addr" class="addr-value" title="">—</div>
    </div>
    <div class="addr-actions">
      <button id="copy" class="btn" type="button">Copy</button>
      <button id="new" class="btn primary" type="button">New</button>
    </div>
  </header>

  <section class="section">
    <h2>Messages</h2>
    <div id="msgs" class="list"></div>
  </section>

  <section class="section">
    <h2>History</h2>
    <div id="hist" class="list"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
